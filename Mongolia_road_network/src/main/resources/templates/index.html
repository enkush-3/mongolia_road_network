<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UB Shortest Path Visualizer</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }

        .path-anim {
            stroke-dasharray: 10;
            animation: dash 30s linear infinite;
        }
        @keyframes dash {
            to { stroke-dashoffset: -1000; }
        }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #sidebar {
            transition: height 0.5s ease, width 0.5s ease, opacity 0.5s ease;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex bg-gray-100 relative">

    <div id="sidebar" class="absolute top-4 left-4 z-[1000] bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl w-80 border border-white/50 flex flex-col overflow-hidden transition-all duration-300" style="max-height: 90vh;">
        
        <div id="sidebar-header" class="p-4 bg-gray-50/50 border-b border-gray-100 cursor-move flex items-center justify-between select-none active:cursor-grabbing">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-map-location-dot text-blue-600"></i>
                <h1 class="text-lg font-bold text-gray-800">Mongolia Path Finder</h1>
            </div>
            <button onclick="toggleSidebar()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-200 transition-colors text-gray-500">
                <i id="toggle-icon" class="fa-solid fa-chevron-up"></i>
            </button>
        </div>

        <div id="sidebar-content" class="p-6 pt-4 flex flex-col gap-5 overflow-y-auto">
            
            <p class="text-xs text-gray-500 leading-relaxed">Монгол улсын хамгийн дөт замыг олох систем.</p>

            <div>
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 block">Алгоритм сонгох</label>
                <div class="flex flex-col gap-2" id="algo-container">
                    <button onclick="setAlgo('astar')" id="btn-astar" class="algo-btn group flex items-center justify-between p-3 rounded-xl border border-gray-200 hover:border-blue-400 hover:bg-blue-50 transition-all text-left">
                        <span class="font-semibold text-gray-700 group-hover:text-blue-700">A*</span>
                        <span class="w-3 h-3 rounded-full bg-blue-500 shadow-sm"></span>
                    </button>
                    <button onclick="setAlgo('bfs')" id="btn-bfs" class="algo-btn group flex items-center justify-between p-3 rounded-xl border border-gray-200 hover:border-green-400 hover:bg-green-50 transition-all text-left">
                        <span class="font-semibold text-gray-700 group-hover:text-green-700">BFS</span>
                        <span class="w-3 h-3 rounded-full bg-green-500 shadow-sm"></span>
                    </button>
                    <button onclick="setAlgo('dijkstra')" id="btn-dijkstra" class="algo-btn active ring-2 ring-purple-500 bg-purple-50 flex items-center justify-between p-3 rounded-xl border border-purple-200 transition-all text-left">
                        <span class="font-semibold text-purple-800">Dijkstra</span>
                        <span class="w-3 h-3 rounded-full bg-purple-500 shadow-sm"></span>
                    </button>
                </div>
            </div>

            <div class="bg-gray-50 p-3 rounded-lg border border-gray-100 text-sm text-gray-600">
                <div class="flex items-center gap-2 mb-1">
                    <span class="w-2 h-2 bg-green-500 rounded-full"></span> 
                    <span>Эхлэх цэгийг сонгох</span>
                </div>
                <div class="flex items-center gap-2 mb-1 hidden">
                    <span>Замын урт (км)</span>
                    <div id="distance-display" class="font-bold text-gray-800"></div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 bg-red-500 rounded-full"></span> 
                    <span>Төгсгөл цэгийг сонгох</span>
                </div>
            </div>

            <div class="mt-auto pt-2">
                <button onclick="clearMap()" class="w-full py-2.5 px-4 bg-red-50 text-red-600 font-semibold rounded-xl hover:bg-red-100 hover:shadow-md transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-trash-can"></i> Цэвэрлэх
                </button>
            </div>

            <div id="loading-indicator" class="hidden flex items-center justify-center gap-2 text-sm text-blue-600 font-medium bg-blue-50 p-2 rounded-lg">
                <div class="loader"></div> Тооцоолж байна...
            </div>
        </div>
    </div>

    <div id="map" class="w-full h-full z-0"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    
    <script>
        let map = L.map("map");

        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);

        const mongoliaBounds = [
            [41.6, 87.7],
            [52.1, 119.9]
        ];

        map.fitBounds(mongoliaBounds);

        let points = [];
        let currentAlgo = "dijkstra";
        let pathLayer = null;
        let isSidebarCollapsed = false;

        function toggleSidebar() {
            const content = document.getElementById('sidebar-content');
            const icon = document.getElementById('toggle-icon');
            const sidebar = document.getElementById('sidebar');

            isSidebarCollapsed = !isSidebarCollapsed;

            if (isSidebarCollapsed) {
                content.style.display = 'none';
                icon.classList.remove('fa-chevron-up');
                icon.classList.add('fa-chevron-down');
            } else {
                content.style.display = 'flex';
                icon.classList.remove('fa-chevron-down');
                icon.classList.add('fa-chevron-up');
            }
        }

        const sidebar = document.getElementById('sidebar');
        const header = document.getElementById('sidebar-header');
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        header.addEventListener('mousedown', (e) => {
            if(e.target.closest('button')) return;

            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            
            const style = window.getComputedStyle(sidebar);
            initialLeft = parseInt(style.left);
            initialTop = parseInt(style.top);

            header.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            sidebar.style.left = `${initialLeft + dx}px`;
            sidebar.style.top = `${initialTop + dy}px`;
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            header.style.cursor = 'move';
        });

        function setAlgo(algo) {
            currentAlgo = algo;
            document.querySelectorAll('.algo-btn').forEach(btn => {
                btn.className = "algo-btn group flex items-center justify-between p-3 rounded-xl border border-gray-200 hover:border-gray-300 hover:bg-gray-50 transition-all text-left";
                btn.querySelector('span').className = "font-semibold text-gray-700";
            });

            const activeBtn = document.getElementById(`btn-${algo}`);
            let colorClass = "", textClass = "";
            
            if(algo === 'astar') { colorClass = "ring-blue-500 bg-blue-50 border-blue-200"; textClass="text-blue-800"; }
            if(algo === 'bfs') { colorClass = "ring-green-500 bg-green-50 border-green-200"; textClass="text-green-800"; }
            if(algo === 'dijkstra') { colorClass = "ring-purple-500 bg-purple-50 border-purple-200"; textClass="text-purple-800"; }

            activeBtn.className = `algo-btn active ring-2 ${colorClass} flex items-center justify-between p-3 rounded-xl transition-all text-left`;
            activeBtn.querySelector('span').className = `font-semibold ${textClass}`;
        }

        function toggleLoading(isLoading) {
            const loader = document.getElementById('loading-indicator');
            loader.style.display = isLoading ? 'flex' : 'none';
        }

        function clearMap() {
            map.eachLayer((layer) => {
                if (layer instanceof L.CircleMarker || layer instanceof L.Polyline) {
                    map.removeLayer(layer);
                }
            });
            points = [];
            pathLayer = null;
        }

        map.on("click", function (e) {
            if (points.length >= 2) clearMap();

            points.push([e.latlng.lat, e.latlng.lng]);
            const isStart = points.length === 1;
            let color = isStart ? "#22c55e" : "#ef4444";
            
            let marker = L.circleMarker(e.latlng, {
                radius: 6, color: "white", weight: 2, fillColor: color, fillOpacity: 1
            }).addTo(map);

            marker.bindTooltip(isStart ? "Эхлэх цэг" : "Төгсгөл цэг", {
                permanent: true, direction: "top", offset: [0, -10],
                className: 'bg-white px-2 py-1 rounded shadow text-xs font-bold'
            }).openTooltip();

            if (points.length === 2) calculatePath();
        });

        function calculatePath() {
            toggleLoading(true);
            const url = `/path?start_lat=${points[0][0]}&start_lon=${points[0][1]}&end_lat=${points[1][0]}&end_lon=${points[1][1]}&algo=${currentAlgo}`;

            fetch(url)
                .then(r => r.json())
                .then(data => {
                    toggleLoading(false);
                    if (data.path) {

                        if (data.total_distance !== undefined) {
                            const km = (data.total_distance / 1000).toFixed(2);
                            document.getElementById("distance-display").innerText = km;
                            document.querySelector("#distance-display").parentElement.classList.remove("hidden");
                        }

                        const pathCoords = data.path.map(p => [p.lat, p.lng]);
                        let color = currentAlgo == "bfs" ? "#22c55e" : currentAlgo == "astar" ? "#3b82f6" : "#a855f7";

                        if (pathLayer) map.removeLayer(pathLayer);

                        pathLayer = L.polyline(pathCoords, {
                            color: color, weight: 3, opacity: 0.8, lineCap: 'round', className: 'path-anim'
                        }).addTo(map);
                        map.fitBounds(pathLayer.getBounds(), {padding: [50, 50]});
                    } else {
                        alert("Зам олдсонгүй!");
                    }
                })
                .catch(err => {
                    toggleLoading(false);
                    console.error(err);
                    alert("Сервертэй холбогдоход алдаа гарлаа.");
                });
        }
    </script>
</body>
</html>
